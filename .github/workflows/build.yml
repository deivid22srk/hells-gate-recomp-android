name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Real, playable APK: the runner downloads YOUR default.xex from the private
# repository (hells-gate-recomp-Archive) using the PRIVATE_REPO_TOKEN secret,
# runs the rexglue codegen against it, and compiles the recompiled game code
# into the APK. The XEX itself is never committed to this repository - it
# exists only on the runner for the duration of the build.
#
# NOTE: the resulting APK embeds game code recompiled from your own dump.
# Artifacts on a public repo are publicly downloadable - keep the token
# (and the game files) in YOUR repos only.

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          # libx11-xcb-dev / libwayland-dev: REQUIRED pkg-config deps of rexui
          # (vulkan/api.h pulls <wayland-client.h>) even in headless CLI builds.
          sudo apt-get install -y ninja-build libx11-xcb-dev libwayland-dev libwayland-client0
          # Clang 19: matches the locally validated toolchain. The runner's
          # default apt clang (18) + libstdc++ 13 fails the SDK's C++23
          # std::expected usage in map_parser.h even though <expected> is
          # included directly.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y clang-19

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ninja ( Gradle's externalNativeBuild uses it via AGP CMake )
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up ReXGlue SDK (clone + patches + submodules)
        run: ./scripts/setup-android.sh

      - name: Install CMake 3.31.1 (exact version required by AGP)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.1" >/dev/null

      - name: Download default.xex from the private repository
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_URL="https://api.github.com/repos/deivid22srk/hells-gate-recomp-Archive/releases/assets/543190069"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o game/default.xex "${ASSET_URL}"
          # Sanity check: the Dante's Inferno NTSC/U XEX is ~10.7 MB.
          SIZE=$(stat -c%s game/default.xex)
          echo "downloaded default.xex: ${SIZE} bytes"
          [ "${SIZE}" -gt 10000000 ] || { echo "XEX too small - download failed"; exit 1; }
          sha256sum game/default.xex

      - name: Build rexglue CLI + run codegen (real game code)
        env:
          # The SDK hard-requires Clang (GCC fails the compiler check).
          CC: clang-19
          CXX: clang++-19
        run: ./scripts/host-codegen.sh

      - name: Verify generated code
        run: |
          test -f generated/default/sources.cmake
          echo "generated sources:"; ls generated/default/*.cpp | wc -l

      - name: Gradle assembleDebug (arm64-v8a)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK packages the GPU plugin
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > /tmp/apk_contents.txt
          cat /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libmain.so" /tmp/apk_contents.txt || {
            echo "ERROR: libmain.so missing from APK"; exit 1; }
          grep -Eq "lib/arm64-v8a/librexgpu-xenos.*\.so" /tmp/apk_contents.txt || {
            echo "ERROR: GPU plugin (librexgpu-xenos*.so) missing from APK -"; \
            echo "       LoadGpuPlugin would fail at runtime (dlopen from nativeLibraryDir)"; exit 1; }
          echo "OK: libmain.so and the GPU plugin are packaged."

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: dantes-inferno-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
